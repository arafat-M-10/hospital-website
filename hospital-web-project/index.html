<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>সেবা হাসপাতাল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section id="login"><div class="lbox">
<div><h1>সেবা হাসপাতাল</h1><p>লগইন করলেই আপনার জন্য আলাদা ড্যাশবোর্ড। ডানদিকের এআই সহকারীকে লিখে বা কথা বলে হাসপাতালের সব কাজ করানো যায়।</p></div>
<div class="card"><label for="u">ইমেইল</label><input id="u" type="email" autocomplete="username"><label for="p">পাসওয়ার্ড</label><input id="p" type="password" autocomplete="current-password">
<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button id="go" style="flex:1">লগইন</button><button id="reg" class="g">রোগী হিসেবে সাইন আপ</button><button id="gst" class="g">গেস্ট</button></div>
<div class="hint" id="hint"></div><div class="hint" id="err" style="color:var(--bad)"></div></div></div></section>

<div id="app">
<header><b id="hd"></b><span><span id="who"></span> <button id="out">বের হন</button></span></header>
<nav id="nav"></nav><main id="main"></main>
<aside><h3>এআই সহকারী</h3><div id="log"></div>
<div class="chips" id="chips"></div>
<div class="opts"><label style="margin:0"><input type="checkbox" id="spk" checked style="width:auto"> উত্তর শোনান</label>
<select id="lang" aria-label="ভাষা"><option value="bn-BD">বাংলা</option><option value="en-US">English</option></select></div>
<div class="inp"><button id="mic" class="g" title="কথা বলুন" aria-label="ভয়েস">🎤</button><input id="q" placeholder="লিখুন বা মাইকে বলুন…" autocomplete="off"><button id="snd">পাঠান</button></div></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/views.js"></script>
<script src="js/actions.js"></script>
<script src="js/ai.js"></script>
<script src="js/voice.js"></script>
</body>
</html>
